name: Deploy Slip2Go Production

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: 'Use canary first; public only after owner real-payment validation'
        required: true
        type: choice
        options:
          - canary
          - public
      confirm:
        description: 'Canary: DEPLOY-SLIP2GO-CANARY | Public: DEPLOY-SLIP2GO-PUBLIC'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-voxel-run-v2-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((inputs.rollout == 'canary' && inputs.confirm == 'DEPLOY-SLIP2GO-CANARY') ||
       (inputs.rollout == 'public' && inputs.confirm == 'DEPLOY-SLIP2GO-PUBLIC'))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      PRODUCTION_PAYMENT_MODE: slip2go-production
      PRODUCTION_SLIP2GO_ROLLOUT: ${{ inputs.rollout }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard approval and protected Slip2Go bindings
        shell: python
        run: |
          import json, os, urllib.request
          rollout=os.environ['PRODUCTION_SLIP2GO_ROLLOUT']
          confirm='${{ inputs.confirm }}'
          expected='DEPLOY-SLIP2GO-CANARY' if rollout=='canary' else 'DEPLOY-SLIP2GO-PUBLIC'
          if confirm != expected:
              raise SystemExit('Explicit rollout confirmation mismatch')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          if not token or not account:
              raise SystemExit('Cloudflare production credentials unavailable')
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/voxel-run-v2-demo/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          bindings=data.get('result',{}).get('bindings',[])
          secret_names={x.get('name') for x in bindings if x.get('type')=='secret_text'}
          required={'SLIP2GO_API_SECRET','PAYMENT_RECEIVER_ACCOUNT'}
          missing=required-secret_names
          if missing:
              raise SystemExit('Missing protected Slip2Go binding(s): '+', '.join(sorted(missing)))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('PRODUCTION_SLIP2GO_CONFIG_VERIFIED=true\n')
          print('PASS approval and protected binding-name guard')
      - name: Production preflight
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/rebuild/check-production-readiness.cjs
          node scripts/rebuild/prepare-production.cjs
          node scripts/rebuild/run-tests.cjs
          node scripts/rebuild/build-client.cjs --check
          node scripts/rebuild/check-syntax.cjs
          node scripts/rebuild/check-static.cjs
          node scripts/rebuild/check-staging.cjs --allow-unconfigured
          node scripts/rebuild/check-secrets.cjs
          git diff --check
      - name: Wrangler Slip2Go dry run
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config work/production/prepared/wrangler.jsonc --outdir work/slip2go-production-dry-run
          test -d work/slip2go-production-dry-run
      - name: Deploy Slip2Go payment mode
        shell: bash
        run: npx wrangler deploy --config work/production/prepared/wrangler.jsonc
      - name: Verify Worker configuration without secret values
        shell: python
        run: |
          import json, os, urllib.error, urllib.request
          origin='https://voxel-run-v2-demo.hjinffv5426.workers.dev'
          opener=urllib.request.build_opener()
          opener.addheaders=[('User-Agent','VOXEL-Slip2Go-Smoke/1.0'),('Accept','application/json,text/plain')]
          with opener.open(origin+'/health',timeout=20) as r:
              body=r.read(65537).decode().strip()
              assert r.status==200 and body=='VOXEL RUN v4 online',(r.status,body)
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/voxel-run-v2-demo/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          bindings=data.get('result',{}).get('bindings',[])
          plain={x.get('name'):x.get('text') for x in bindings if x.get('type')=='plain_text'}
          secrets={x.get('name') for x in bindings if x.get('type')=='secret_text'}
          assert plain.get('PAYMENT_MODE')=='slip2go-production',plain.get('PAYMENT_MODE')
          assert plain.get('PAYMENT_ROLLOUT')==os.environ['PRODUCTION_SLIP2GO_ROLLOUT'],plain.get('PAYMENT_ROLLOUT')
          assert {'SLIP2GO_API_SECRET','PAYMENT_RECEIVER_ACCOUNT'} <= secrets
          print('PASS Worker health, rollout mode and protected binding names')
