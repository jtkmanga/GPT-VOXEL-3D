name: Temporary Production Zone WebSocket Probe

on:
  push:
    branches:
      - diag/prod-zone-websocket-20261028

permissions:
  contents: read

jobs:
  tail-and-probe:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save --ignore-scripts ws@8.18.3
      - name: Tail Production and reproduce Zone 500
        shell: bash
        run: |
          set -uo pipefail
          (
            sleep 8
            node <<'NODE'
          const WebSocket = require('ws');
          const origin='https://jtkmanga.github.io';
          const zones=['0,0','5,5','9,9'];
          function probe(zone){
            return new Promise(resolve=>{
              const url='wss://voxel-run-v2-demo.hjinffv5426.workers.dev/play?zone='+encodeURIComponent(zone);
              const ws=new WebSocket(url,[],{origin});
              const timer=setTimeout(()=>{ console.log('PROBE TIMEOUT',zone); try{ws.terminate()}catch{} resolve(); },5000);
              ws.on('open',()=>{ console.log('PROBE OPEN',zone); ws.send(JSON.stringify({type:'move',input:{x:0,z:0,jump:false},seq:0})); });
              ws.on('unexpected-response',(_req,res)=>{ clearTimeout(timer); console.log('PROBE HTTP',zone,res.statusCode); resolve(); });
              ws.on('close',(code,reason)=>{ clearTimeout(timer); console.log('PROBE CLOSE',zone,code,String(reason)); resolve(); });
              ws.on('error',err=>console.log('PROBE ERROR',zone,err.message));
            });
          }
          (async()=>{ for(const z of zones) await probe(z); })();
          NODE
          ) &
          PROBE_PID=$!
          echo '--- WRANGLER TAIL START ---'
          timeout --signal=TERM --kill-after=3s 28s npx wrangler tail voxel-run-v2-demo --format json || true
          echo '--- WRANGLER TAIL END ---'
          wait "$PROBE_PID" || true
