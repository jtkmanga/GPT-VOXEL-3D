name: Deploy PromptPay Production

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: 'Choose canary first; public only after live-payment validation'
        required: true
        type: choice
        options:
          - canary
          - public
      confirm:
        description: 'Canary: DEPLOY-PROMPTPAY-CANARY | Public: DEPLOY-PROMPTPAY-PUBLIC'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-voxel-run-v2-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((inputs.rollout == 'canary' && inputs.confirm == 'DEPLOY-PROMPTPAY-CANARY') ||
       (inputs.rollout == 'public' && inputs.confirm == 'DEPLOY-PROMPTPAY-PUBLIC'))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      PRODUCTION_PAYMENT_MODE: 2c2p-promptpay-production
      PRODUCTION_TWOC2P_MERCHANT_ID: ${{ secrets.PRODUCTION_TWOC2P_MERCHANT_ID }}
      PRODUCTION_TWOC2P_SECRET_KEY: ${{ secrets.PRODUCTION_TWOC2P_SECRET_KEY }}
      PRODUCTION_TWOC2P_PROMPTPAY_CAPABILITY_VERIFIED: ${{ vars.PRODUCTION_TWOC2P_PROMPTPAY_CAPABILITY_VERIFIED }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve rollout gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.rollout }}" = "public" ]; then
            test "${{ inputs.confirm }}" = "DEPLOY-PROMPTPAY-PUBLIC"
            echo "PRODUCTION_TWOC2P_PROMPTPAY_CHECKOUT_ENABLED=true" >> "$GITHUB_ENV"
          else
            test "${{ inputs.confirm }}" = "DEPLOY-PROMPTPAY-CANARY"
            echo "PRODUCTION_TWOC2P_PROMPTPAY_CHECKOUT_ENABLED=false" >> "$GITHUB_ENV"
          fi
          test "$PRODUCTION_TWOC2P_PROMPTPAY_CAPABILITY_VERIFIED" = "true"
          test -n "$PRODUCTION_TWOC2P_MERCHANT_ID"
          test -n "$PRODUCTION_TWOC2P_SECRET_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -q '"PAYMENT_MODE": "disabled"' wrangler.jsonc
          ! grep -q 'TWOC2P_PRODUCTION_SECRET_KEY' wrangler.jsonc
      - name: Production preflight
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/rebuild/check-production-readiness.cjs
          node scripts/rebuild/prepare-production.cjs
          node scripts/rebuild/run-tests.cjs
          node scripts/rebuild/build-client.cjs --check
          node scripts/rebuild/check-syntax.cjs
          node scripts/rebuild/check-static.cjs
          node scripts/rebuild/check-staging.cjs --allow-unconfigured
          node scripts/rebuild/check-secrets.cjs
          git diff --check
      - name: Wrangler PromptPay dry run
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config work/production/prepared/wrangler.jsonc --outdir work/promptpay-production-dry-run
          test -d work/promptpay-production-dry-run
      - name: Install protected 2C2P production secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PRODUCTION_TWOC2P_SECRET_KEY" | npx wrangler secret put TWOC2P_PRODUCTION_SECRET_KEY --config work/production/prepared/wrangler.jsonc
      - name: Deploy PromptPay production adapter
        shell: bash
        run: npx wrangler deploy --config work/production/prepared/wrangler.jsonc
      - name: Verify health and rollout gate
        shell: python
        run: |
          import json, urllib.error, urllib.request
          origin='https://voxel-run-v2-demo.hjinffv5426.workers.dev'
          opener=urllib.request.build_opener()
          opener.addheaders=[('User-Agent','VOXEL-PromptPay-Smoke/1.0'),('Accept','application/json,text/plain')]
          with opener.open(origin+'/health', timeout=20) as r:
              body=r.read(65537).decode().strip()
              assert r.status == 200 and body == 'VOXEL RUN v4 online', (r.status,body)
          req=urllib.request.Request(origin+'/payments/promptpay/checkout',
              data=json.dumps({'requestId':'smoke-test-do-not-charge'}).encode(), method='POST',
              headers={'Content-Type':'application/json','Origin':'https://jtkmanga.github.io'})
          try:
              opener.open(req, timeout=20)
              raise AssertionError('Unauthenticated PromptPay checkout unexpectedly succeeded')
          except urllib.error.HTTPError as e:
              body=e.read(65537).decode(errors='replace')
              if '${{ inputs.rollout }}' == 'canary':
                  assert e.code == 503 and 'disabled' in body.lower(), (e.code,body)
              else:
                  assert e.code == 401 and 'sign in' in body.lower(), (e.code,body)
          slip=urllib.request.Request(origin+'/verify-slip',data=b'',method='POST',
              headers={'Content-Type':'application/octet-stream'})
          try:
              opener.open(slip, timeout=20)
              raise AssertionError('Legacy slip verification unexpectedly enabled')
          except urllib.error.HTTPError as e:
              assert e.code == 503, e.code
          print('PASS PromptPay rollout smoke checks')
