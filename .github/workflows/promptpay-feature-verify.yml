name: PromptPay Feature Verification
# rerun after randomUUID compatibility fix

on:
  push:
    branches:
      - feature/promptpay-dynamic-qr
    paths:
      - '.github/workflows/promptpay-feature-verify.yml'

permissions:
  contents: write

concurrency:
  group: promptpay-feature-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/promptpay-dynamic-qr
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build canonical client
        run: node scripts/rebuild/build-client.cjs
      - name: PromptPay targeted tests
        run: node --test tests/rebuild/promptpay-payment.test.cjs
      - name: Full regression
        run: node scripts/rebuild/run-tests.cjs
      - name: Static and secret checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild/check-syntax.cjs
          node scripts/rebuild/check-static.cjs
          node scripts/rebuild/check-staging.cjs --allow-unconfigured
          node scripts/rebuild/check-secrets.cjs
          git diff --check
      - name: Commit generated index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Generated client already current"
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v '^ M index.html$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: sync PromptPay client"
          git push origin HEAD:feature/promptpay-dynamic-qr
