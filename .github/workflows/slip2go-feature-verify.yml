name: Slip2Go Feature Verification
# rerun after staging assertion cleanup

on:
  push:
    branches:
      - feature/promptpay-dynamic-qr
    paths:
      - '.github/workflows/slip2go-feature-verify.yml'

permissions:
  contents: write

concurrency:
  group: slip2go-feature-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCTION_PAYMENT_MODE: slip2go-production
      PRODUCTION_SLIP2GO_CONFIG_VERIFIED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/promptpay-dynamic-qr
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build canonical client
        run: node scripts/rebuild/build-client.cjs
      - name: Slip2Go targeted tests
        run: node --test tests/rebuild/slip2go-payment.test.cjs
      - name: Full regression
        run: node scripts/rebuild/run-tests.cjs
      - name: Static and secret checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild/check-syntax.cjs
          node scripts/rebuild/check-static.cjs
          node scripts/rebuild/check-staging.cjs --allow-unconfigured
          node scripts/rebuild/check-secrets.cjs
          git diff --check
      - name: Slip2Go production preparation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild/check-production-readiness.cjs
          node scripts/rebuild/prepare-production.cjs
          grep -q '"PAYMENT_MODE": "slip2go-production"' work/production/prepared/wrangler.jsonc
          grep -q '"PAYMENT_RECEIVER_TYPE": "phone_number"' work/production/prepared/wrangler.jsonc
          ! grep -q 'SLIP2GO_API_SECRET' work/production/prepared/wrangler.jsonc
          ! grep -q 'PAYMENT_RECEIVER_ACCOUNT' work/production/prepared/wrangler.jsonc
      - name: Wrangler Slip2Go dry run
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config work/production/prepared/wrangler.jsonc --outdir work/slip2go-dry-run
          test -d work/slip2go-dry-run
      - name: Commit generated index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Generated client already current"
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v '^ M index.html$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: sync Slip2Go client"
          git push origin HEAD:feature/promptpay-dynamic-qr
