name: Sync Generated Client

on:
  push:
    branches:
      - development/voxel-continuous
      - development/promptpay-dynamic-qr
    paths:
      - "src/client/**"
      - "src/shared/**"
      - "scripts/rebuild/build-client.cjs"
      - ".github/workflows/sync-generated-client.yml"

permissions:
  contents: write

concurrency:
  group: sync-generated-client-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build canonical client
        run: node scripts/rebuild/build-client.cjs
      - name: Commit generated index only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Generated client already current"
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v '^ M index.html$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: sync generated client"
          git push origin HEAD:${{ github.ref_name }}
