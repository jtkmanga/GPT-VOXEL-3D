name: Validate Lucky From Exact Staging Runtime

on:
  push:
    branches:
      - restore/lucky-game-from-staging-20261028
    paths:
      - .github/workflows/temp-lucky-stage-verify.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Run focused Staging movement and Zone regressions
        run: |
          node --test tests/rebuild/staging-movement-regression.test.cjs tests/rebuild/staging-zone-transition-server.test.cjs tests/rebuild/staging-session-scale.test.cjs
      - name: Read existing public App Check identity without showing values
        shell: python
        run: |
          import os,json,urllib.request,re
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          if not token or not account:
              raise SystemExit('Production environment credentials unavailable')
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/voxel-run-v2-demo/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          bindings=data.get('result',{}).get('bindings',[])
          secrets={b.get('name') for b in bindings if b.get('type')=='secret_text'}
          assert {'SLIP2GO_API_SECRET','PAYMENT_RECEIVER_ACCOUNT'} <= secrets,'Rollback credentials missing'
          site=next((b.get('text') for b in bindings if b.get('name')=='FIREBASE_APP_CHECK_SITE_KEY' and b.get('type')=='plain_text'),None)
          if not re.fullmatch(r'6L[A-Za-z0-9_-]{30,80}',str(site or '')):
              raise SystemExit('Public App Check key is missing')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('LUCKY_APP_CHECK_SITE_KEY='+site+'\n')
          print('PASS Firebase public identity and protected rollback secret names')
      - name: Assemble exact Staging gameplay with Lucky public origin
        run: |
          node scripts/rebuild/build-lucky-from-staging.cjs
          node scripts/rebuild/build-lucky-from-staging.cjs --check
          node scripts/rebuild/check-syntax.cjs
          git diff --check
      - name: Commit rebuilt GitHub Pages asset on guarded branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build(client): publish complete Staging gameplay baseline"
            git push origin HEAD:restore/lucky-game-from-staging-20261028
          fi
