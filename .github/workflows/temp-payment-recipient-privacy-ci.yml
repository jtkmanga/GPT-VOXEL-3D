name: Temporary Payment Recipient Privacy Regression

on:
  push:
    branches:
      - fix/hide-payment-recipient-details-20261028
    paths:
      - .github/workflows/temp-payment-recipient-privacy-ci.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Confirm stable gameplay and Canary permission unchanged
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --quiet origin/main HEAD -- src/worker/room-security.mjs src/worker/game-room.mjs src/worker/zone-room.mjs src/shared src/client/staging-runtime.js src/client/secure-socket-handoff.js src/client/world.js src/client/wheel-frame.js
          test ! -e src/client/production-staging-gameplay.js
          grep -q '"PAYMENT_MODE": "disabled"' wrangler.jsonc
          grep -q "paymentRolloutAllowed(env,verified)" src/worker/http.mjs
          echo "PASS no gameplay/privilege changes"
      - name: Retrieve existing public App Check key without disclosing its value
        shell: python
        run: |
          import os,json,urllib.request,re
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/voxel-run-v2-demo/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
          b={x['name']:x for x in data['result']['bindings']}
          assert b['ADMIN_OWNER_EMAIL']['text'].strip().lower()=='jtkmanga@gmail.com'
          assert b['PAYMENT_MODE']['text']=='slip2go-production'
          assert b['PAYMENT_ROLLOUT']['text']=='canary'
          assert b['FIREBASE_PROJECT_ID']['text']=='lucky-game-6936b'
          assert all(b[n]['type']=='secret_text' for n in ('SLIP2GO_API_SECRET','PAYMENT_RECEIVER_ACCOUNT'))
          site=b['FIREBASE_APP_CHECK_SITE_KEY']['text']
          assert re.fullmatch(r'6L[A-Za-z0-9_-]{30,80}',site)
          print('::add-mask::'+site)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('LUCKY_APP_CHECK_SITE_KEY='+site+'\n')
          print('PASS original owner canary and secret name presence')
      - name: Build privacy-safe owner-canary page, test payment and stable movement
        run: |
          set -euo pipefail
          node scripts/rebuild/build-lucky-from-staging.cjs
          node scripts/rebuild/build-lucky-from-staging.cjs --check
          node --test tests/rebuild/payment-recipient-display-privacy.test.cjs tests/rebuild/slip2go-payment.test.cjs tests/rebuild/payment-qr-cache.test.cjs tests/rebuild/slip2go-auth.test.cjs tests/rebuild/slip2go-admin-canary-ui.test.cjs tests/rebuild/vip-movement-session-scale.test.cjs tests/rebuild/staging-movement-regression.test.cjs
          node scripts/rebuild/check-syntax.cjs
          node scripts/rebuild/check-secrets.cjs
          git diff --check
      - name: Worker module can be bundled without deployment
        run: |
          npx wrangler deploy --dry-run --config wrangler.jsonc --outdir work/privacy-qr-dry-run
          test -d work/privacy-qr-dry-run
      - name: Publish privacy-safe HTML on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build(client): hide payment recipient metadata in QR UI"
            git push origin HEAD:fix/hide-payment-recipient-details-20261028
          fi
