# Validation marker: admin-liveops-final-synced
name: Gate 7 Pre-Review

on:
  push:
    branches: [development/voxel-continuous]
    paths:
      - 'src/**'
      - 'scripts/rebuild/**'
      - 'tests/rebuild/**'
      - 'worker.js'
      - 'index.html'
      - 'wrangler.staging.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate7-pre-review
  cancel-in-progress: true

jobs:
  pre-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Development verification suite
        run: node scripts/rebuild/verify-development.cjs
      - name: Incremental committed-history credential audit
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python scripts/rebuild/audit-git-secrets.py             --include "$(git rev-parse HEAD)"             --exclude 865ec976d6f79d28f508843cfe8247e09b3ddbaf             > /tmp/gate7-secret-audit.json
          set -e
          node -e "const r=require('/tmp/gate7-secret-audit.json'); const dangerous=r.findings.filter(f=>f.type!=='Firebase web API key'); const publicReview=r.findings.filter(f=>f.type==='Firebase web API key'); const expectedPublic=new Set(['index.html','src/client/auth-state.js']); const unexpectedPublic=publicReview.filter(f=>!expectedPublic.has(f.path)); if(dangerous.length||unexpectedPublic.length||r.gaps.length){console.error(JSON.stringify({findings:[...dangerous,...unexpectedPublic].map(({type,path,line})=>({type,path,line})),gaps:r.gaps.map(({path,reason})=>({path,reason}))},null,2));process.exit(1)} console.log('PASS incremental secret audit:',r.objects,'objects; reviewed baseline Firebase web config:',publicReview.length)"
      - name: Production payment remains fail-closed
        env:
          PRODUCTION_PAYMENT_MODE: disabled
        run: node scripts/rebuild/check-production-readiness.cjs
      - name: Production config and branch diff guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git fetch --no-tags origin main
          git diff --exit-code origin/main -- wrangler.jsonc
          echo "PASS production wrangler matches current main"
