name: Validate Staging Worker For Lucky Game

on:
  push:
    branches:
      - restore/lucky-game-from-staging-20261028
    paths:
      - '.github/workflows/temp-worker-staging-dry-run.yml'

permissions:
  contents: read

jobs:
  worker-dry-run:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Validate Staging-derived Worker imports and identity
        run: |
          set -euo pipefail
          node scripts/rebuild/check-syntax.cjs
          grep -q '"name": "voxel-run-v2-demo"' wrangler.jsonc
          grep -q '"PAYMENT_MODE": "disabled"' wrangler.jsonc
          ! test -e src/client/production-staging-gameplay.js
          test -f src/client/staging-runtime.js
          node --test tests/rebuild/staging-movement-regression.test.cjs tests/rebuild/staging-session-scale.test.cjs tests/rebuild/staging-zone-transition-server.test.cjs
      - name: Prepare exact production bindings with payments disabled (read-only account query)
        shell: python
        run: |
          import os,json,pathlib,urllib.request
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          if not token or not account: raise SystemExit('Production environment credentials unavailable')
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/voxel-run-v2-demo/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
          bindings=data.get('result',{}).get('bindings',[])
          by_name={b.get('name'):b for b in bindings}
          assert all(by_name.get(n,{}).get('type')=='secret_text' for n in ('SLIP2GO_API_SECRET','PAYMENT_RECEIVER_ACCOUNT'))
          assert by_name.get('ALLOWED_ORIGIN',{}).get('text')=='https://jtkmanga.github.io'
          cfg=json.load(open('wrangler.jsonc'))
          cfg['main']='../../worker.js'
          cfg['vars']={b['name']:b['text'] for b in bindings if b.get('type')=='plain_text'}
          cfg['vars']['PAYMENT_MODE']='disabled'
          cfg['vars']['PAYMENT_ROLLOUT']='disabled'
          cfg['triggers']={'crons':['0 17 * * *']}
          assert all(x not in cfg['vars'] for x in ('APP_ENV','STAGING_WORKER_NAME','STAGING_WORKER_ORIGIN'))
          path=pathlib.Path('work/lucky-stage-deploy')
          path.mkdir(parents=True,exist_ok=True)
          (path/'wrangler.jsonc').write_text(json.dumps(cfg))
          print('PASS prepared safe production config without revealing values or deploying')
      - name: Bundle full Staging Worker for Lucky Game without deploying
        run: |
          npx wrangler deploy --dry-run --config work/lucky-stage-deploy/wrangler.jsonc --outdir work/lucky-worker-dry-run
          test -d work/lucky-worker-dry-run
          git diff --check
