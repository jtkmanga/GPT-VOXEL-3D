name: One-Shot Slip2Go Provider Error Patch 2026-10-26

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-slip2go-provider-patch-20261026.yml'

permissions:
  contents: read

concurrency:
  group: deploy-voxel-run-v2-demo-production
  cancel-in-progress: false

jobs:
  deploy-patch:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      PRODUCTION_PAYMENT_MODE: slip2go-production
      PRODUCTION_SLIP2GO_ROLLOUT: canary
      PRODUCTION_SLIP2GO_CONFIG_VERIFIED: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard exact Canary patch commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^)" = "2fc6fe753357881ef43b88f51b2066a675d3f773"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = ".github/workflows/one-shot-slip2go-provider-patch-20261026.yml"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Patch preflight
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test tests/rebuild/slip2go-payment.test.cjs
          node scripts/rebuild/run-tests.cjs
          node scripts/rebuild/build-client.cjs --check
          node scripts/rebuild/check-syntax.cjs
          node scripts/rebuild/check-static.cjs
          node scripts/rebuild/check-staging.cjs --allow-unconfigured
          node scripts/rebuild/check-secrets.cjs
          node scripts/rebuild/check-production-readiness.cjs
          node scripts/rebuild/prepare-production.cjs
          git diff --check
          grep -q '"PAYMENT_MODE": "slip2go-production"' work/production/prepared/wrangler.jsonc
          grep -q '"PAYMENT_ROLLOUT": "canary"' work/production/prepared/wrangler.jsonc
      - name: Dry run
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config work/production/prepared/wrangler.jsonc --outdir work/slip2go-provider-patch-dry-run
          test -d work/slip2go-provider-patch-dry-run
      - name: Deploy patch
        shell: bash
        run: npx wrangler deploy --config work/production/prepared/wrangler.jsonc
      - name: Smoke test Canary
        shell: python
        run: |
          import json, urllib.error, urllib.request
          origin='https://voxel-run-v2-demo.hjinffv5426.workers.dev'
          app_origin='https://jtkmanga.github.io'
          opener=urllib.request.build_opener()
          opener.addheaders=[('User-Agent','VOXEL-Slip2Go-Smoke/1.0'),('Accept','application/json,text/plain')]
          with opener.open(origin+'/health',timeout=20) as r:
              assert r.status==200
              assert r.read(65537).decode().strip()=='VOXEL RUN v4 online'
          preflight=urllib.request.Request(origin+'/payment-qr',method='OPTIONS',headers={
              'Origin':app_origin,
              'Access-Control-Request-Method':'POST',
              'Access-Control-Request-Headers':'authorization,content-type,x-firebase-appcheck'
          })
          with opener.open(preflight,timeout=20) as r:
              assert r.status==204
              assert r.headers.get('Access-Control-Allow-Origin')==app_origin
          post=urllib.request.Request(origin+'/payment-qr',
              data=json.dumps({'item':'vip1'}).encode(),method='POST',
              headers={'Content-Type':'application/json','Origin':app_origin})
          try:
              opener.open(post,timeout=20)
              raise AssertionError('Unauthenticated payment QR unexpectedly succeeded')
          except urllib.error.HTTPError as e:
              assert e.code==401
          print('PASS Canary health, CORS and unauthenticated fail-closed checks')
