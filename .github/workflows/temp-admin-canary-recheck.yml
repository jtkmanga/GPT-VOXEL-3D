name: Temporary Admin Canary Endpoint Recheck

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-admin-canary-recheck.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only health and anonymous authorization checks
        shell: python
        run: |
          import json,urllib.request,urllib.error
          base='https://voxel-run-v2-demo.hjinffv5426.workers.dev'
          opener=urllib.request.build_opener()
          opener.addheaders=[('Origin','https://jtkmanga.github.io'),
                             ('Accept','application/json'),
                             ('User-Agent','Voxel-Owner-Canary-Check/1.0')]
          with opener.open(base+'/health',timeout=20) as r:
              print('HEALTH',r.status)
              assert r.status==200
          for endpoint,data,ctype in [('/payment-qr',b'{"item":"vip1"}','application/json'),
                                       ('/verify-slip',b'','application/octet-stream')]:
              req=urllib.request.Request(base+endpoint,data=data,method='POST',headers={'content-type':ctype})
              try:
                  with opener.open(req,timeout=20) as r:
                      status=r.status
                      payload=r.read(400)
              except urllib.error.HTTPError as e:
                  status=e.code
                  payload=e.read(400)
              try:
                  message=str(json.loads(payload.decode(errors='replace')).get('error',''))[:140]
              except Exception:
                  message='[non-JSON response]'
              print(endpoint,'status',status,'error',message)
              if status not in (401,403):
                  raise SystemExit('FAIL: anonymous Canary auth boundary: '+endpoint)
          print('PASS both endpoints reject anonymous requests before provider integration')
