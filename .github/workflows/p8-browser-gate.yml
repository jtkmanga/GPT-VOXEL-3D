# Validation marker: admin-liveops-final-synced
name: P8 Browser Gate

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild-p0-p8
      - development/voxel-continuous
    paths:
      - ".github/workflows/p8-browser-gate.yml"
      - "tests/rebuild/p1-browser.py"
      - "index.html"
      - "src/client/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: npm ci

      - name: Install Python Playwright
        run: python -m pip install playwright==1.62.0

      - name: Install Chromium and system dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Locate Chromium and provide expected executable path
        shell: bash
        run: |
          set -euo pipefail

          PLAYWRIGHT_CHROMIUM="$(find "$HOME/.cache/ms-playwright" -type f \( -name chromium -o -name chrome \) -perm -111 2>/dev/null | head -n 1 || true)"

          if [ -z "$PLAYWRIGHT_CHROMIUM" ]; then
            echo "ERROR: Could not locate Playwright Chromium executable."
            find "$HOME/.cache/ms-playwright" -maxdepth 4 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Found Chromium: $PLAYWRIGHT_CHROMIUM"
          sudo ln -sf "$PLAYWRIGHT_CHROMIUM" /usr/bin/chromium

          test -x /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Run original P8 browser/client gate
        id: browser_test
        shell: bash
        run: |
          set -o pipefail
          python tests/rebuild/p1-browser.py 2>&1 | tee p8-browser.log

      - name: Upload browser gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-browser-diagnostics
          path: p8-browser.log
          if-no-files-found: warn
          retention-days: 3
