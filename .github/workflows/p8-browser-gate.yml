name: P8 Browser Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run original P8 browser/client gate
        run: python tests/rebuild/p1-browser.py
