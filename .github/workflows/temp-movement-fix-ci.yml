name: Temporary Movement Fix CI

on:
  push:
    branches:
      - fix/smooth-authoritative-reconciliation-20261028

permissions:
  contents: write

jobs:
  movement-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Sync generated client on validation branch
        run: |
          npm run build:client
          git diff --check
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build(client): sync movement smoothing"
            git push
          fi
      - name: Movement and production parity tests
        run: |
          node --test \
            tests/rebuild/production-staging-gameplay-parity.test.cjs \
            tests/rebuild/production-exact-staging-runtime.test.cjs \
            tests/rebuild/production-zone-handoff.test.cjs \
            tests/rebuild/staging-movement-regression.test.cjs
      - name: Client build checks
        run: |
          node scripts/rebuild/build-client.cjs --check
          node scripts/rebuild/check-syntax.cjs
          git diff --check
      - name: Full regression suite
        run: npm test
