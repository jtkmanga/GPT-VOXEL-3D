name: Sync Promotion Client

on:
  push:
    branches:
      - promotion/staging-client-production
    paths:
      - "src/client/**"
      - "src/shared/**"
      - "scripts/rebuild/build-client.cjs"
      - ".github/workflows/sync-promotion-client.yml"

permissions:
  contents: write

concurrency:
  group: sync-promotion-client
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promotion/staging-client-production
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build canonical production client
        run: node scripts/rebuild/build-client.cjs
      - name: Commit generated index only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Generated client already current"
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v '^ M index.html$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: sync exact staging gameplay client"
          git push origin HEAD:promotion/staging-client-production
