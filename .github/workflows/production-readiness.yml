name: Production Readiness

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-readiness.yml'
      - 'scripts/rebuild/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CHECK-PRODUCTION-ONLY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'push' || inputs.confirm == 'CHECK-PRODUCTION-ONLY'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    env:
      PRODUCTION_PAYMENT_MODE: ${{ vars.PRODUCTION_PAYMENT_MODE }}
      PRODUCTION_TWOC2P_MERCHANT_ID: ${{ secrets.PRODUCTION_TWOC2P_MERCHANT_ID }}
      PRODUCTION_TWOC2P_SECRET_KEY: ${{ secrets.PRODUCTION_TWOC2P_SECRET_KEY }}
      PRODUCTION_FIREBASE_PUBLIC_CONFIG: ${{ vars.PRODUCTION_FIREBASE_PUBLIC_CONFIG }}
      PRODUCTION_APP_CHECK_SITE_KEY: ${{ vars.PRODUCTION_APP_CHECK_SITE_KEY }}
      PRODUCTION_ALLOWED_ORIGIN: ${{ vars.PRODUCTION_ALLOWED_ORIGIN }}
      PRODUCTION_WORKER_ORIGIN: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm no deploy command exists
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.confirm }}" = "CHECK-PRODUCTION-ONLY"
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/production-readiness.yml').read_text(encoding='utf-8')
          marker = '      - name: Production configuration preflight'
          tail = text.split(marker, 1)[1] if marker in text else ''
          checks = (
              'cloudflare/' + 'wrangler-action',
              'wrangler-' + 'action@',
              'pages ' + 'deploy',
          )
          lowered = tail.lower()
          hits = [item for item in checks if item in lowered]
          if hits:
              raise SystemExit('forbidden deploy primitive present after self-check: ' + ', '.join(hits))
          print('PASS no production deploy primitive present')
          PY
      - name: Production configuration preflight
        run: node scripts/rebuild/check-production-readiness.cjs
      - name: Release verification suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if [ -f scripts/rebuild/build-lucky-from-staging.cjs ] && [ ! -f src/client/production-staging-gameplay.js ]; then
            # Exact Staging gameplay baseline: legacy static tests intentionally
            # target the replaced production override and are no longer a
            # valid acceptance oracle. Keep them visible in Git history.
            # This is offline test coverage, NOT a live Zone capacity pass.
            node --test tests/rebuild/staging-movement-regression.test.cjs \
              tests/rebuild/staging-session-scale.test.cjs \
              tests/rebuild/staging-zone-transition-server.test.cjs
            node scripts/rebuild/check-syntax.cjs
            node scripts/rebuild/check-secrets.cjs
            echo "PASS Staging-source baseline offline tests; live Zone admission requires separate probe"
          else
            node scripts/rebuild/run-tests.cjs
            node scripts/rebuild/build-client.cjs --check
            node scripts/rebuild/check-syntax.cjs
            node scripts/rebuild/check-static.cjs
            node scripts/rebuild/check-staging.cjs --allow-unconfigured
            node scripts/rebuild/check-secrets.cjs
          fi
      - name: Production config safety guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '"name": "voxel-run-v2-demo"' wrangler.jsonc
          grep -q '"FIREBASE_PROJECT_ID": "lucky-game-6936b"' wrangler.jsonc
          grep -q '"PAYMENT_MODE": "disabled"' wrangler.jsonc
          ! grep -q 'gpt-voxel-3d-staging-01' wrangler.jsonc
          ! grep -q 'TWOC2P_SANDBOX_' wrangler.jsonc
          echo "PASS production config safety guard"
