name: Production Readiness

on:
  push:
    branches:
      - main
      - release/production-prep
      - validation/staging-runtime-production
    paths:
      - '.github/workflows/production-readiness.yml'
      - 'scripts/rebuild/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CHECK-PRODUCTION-ONLY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'push' || inputs.confirm == 'CHECK-PRODUCTION-ONLY'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    env:
      PRODUCTION_PAYMENT_MODE: ${{ vars.PRODUCTION_PAYMENT_MODE }}
      PRODUCTION_TWOC2P_MERCHANT_ID: ${{ secrets.PRODUCTION_TWOC2P_MERCHANT_ID }}
      PRODUCTION_TWOC2P_SECRET_KEY: ${{ secrets.PRODUCTION_TWOC2P_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm no deploy command exists
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.confirm }}" = "CHECK-PRODUCTION-ONLY"
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/production-readiness.yml').read_text(encoding='utf-8')
          marker = '      - name: Production configuration preflight'
          tail = text.split(marker, 1)[1] if marker in text else ''
          checks = (
              'cloudflare/' + 'wrangler-action',
              'wrangler-' + 'action@',
              'pages ' + 'deploy',
          )
          lowered = tail.lower()
          hits = [item for item in checks if item in lowered]
          if hits:
              raise SystemExit('forbidden deploy primitive present after self-check: ' + ', '.join(hits))
          print('PASS no production deploy primitive present')
          PY
      - name: Release verification suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if [ "${{ github.ref }}" = "refs/heads/development/voxel-continuous" ]; then
            node scripts/rebuild/verify-development.cjs
          else
            node scripts/rebuild/run-tests.cjs
            node scripts/rebuild/build-client.cjs --check
            node scripts/rebuild/check-syntax.cjs
            node scripts/rebuild/check-static.cjs
            node scripts/rebuild/check-staging.cjs --allow-unconfigured
            node scripts/rebuild/check-secrets.cjs
          fi
      - name: Production configuration preflight
        run: node scripts/rebuild/check-production-readiness.cjs
      - name: Prepare production config (no deploy)
        run: node scripts/rebuild/prepare-production.cjs
      - name: Production config safety guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code origin/main -- wrangler.jsonc
          grep -q '"name": "voxel-run-v2-demo"' wrangler.jsonc
          grep -q '"FIREBASE_PROJECT_ID": "lucky-game-6936b"' wrangler.jsonc
          grep -q '"PAYMENT_MODE": "disabled"' wrangler.jsonc
          ! grep -q 'gpt-voxel-3d-staging-01' wrangler.jsonc
          ! grep -q 'TWOC2P_SANDBOX_' wrangler.jsonc
          grep -q '"0 17 \* \* \*"' work/production/prepared/wrangler.jsonc
          grep -q '"ADMIN_OWNER_EMAIL": "jtkmanga@gmail.com"' work/production/prepared/wrangler.jsonc
          echo "PASS production baseline preserved; prepared release config contains cron/admin controls"
      - name: Wrangler production dry run (prepared config only)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config work/production/prepared/wrangler.jsonc --outdir work/production-dry-run
          test -d work/production-dry-run
          echo "PASS production dry run; no deployment performed"
