name: Temporary Lucky VIP Payment Routing CI

on:
  push:
    branches:
      - fix/lucky-vip-payment-no-2c2p-fallback-20261028
    paths:
      - '.github/workflows/temp-lucky-vip-payment-routing-ci.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Verify stable movement and payments remain closed
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --quiet origin/main HEAD -- src/worker src/shared src/client/secure-socket-handoff.js src/client/wheel-frame.js
          grep -q '"PAYMENT_MODE": "disabled"' wrangler.jsonc
          echo 'PASS stable gameplay, Cloudflare Worker, and payment settings unchanged'
      - name: Load public App Check key for deterministic client rebuild
        shell: python
        run: |
          import json,os,re,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/voxel-run-v2-demo/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r: result=json.load(r)
          bindings=result['result']['bindings']
          site=next(x['text'] for x in bindings if x.get('name')=='FIREBASE_APP_CHECK_SITE_KEY')
          assert re.fullmatch(r'6L[A-Za-z0-9_-]{30,80}',site)
          assert next(x['text'] for x in bindings if x.get('name')=='PAYMENT_MODE')=='disabled'
          print('::add-mask::'+site)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('LUCKY_APP_CHECK_SITE_KEY='+site+'\n')
      - name: Rebuild Lucky client with payments OFF and check routing
        run: |
          node scripts/rebuild/build-lucky-from-staging.cjs
          node scripts/rebuild/build-lucky-from-staging.cjs --check
          node --test tests/rebuild/lucky-vip-payment-routing.test.cjs
          node --test tests/rebuild/staging-movement-regression.test.cjs tests/rebuild/vip-movement-session-scale.test.cjs
          node scripts/rebuild/check-syntax.cjs
          git diff --check
      - name: Commit updated public HTML without changing Worker
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build(client): remove Lucky VIP 2C2P fallback"
            git push origin HEAD:fix/lucky-vip-payment-no-2c2p-fallback-20261028
          fi
