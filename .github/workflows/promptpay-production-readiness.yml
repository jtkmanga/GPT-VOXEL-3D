name: PromptPay Production Readiness

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CHECK-PROMPTPAY-PRODUCTION'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promptpay-production-readiness
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'CHECK-PROMPTPAY-PRODUCTION'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    env:
      PRODUCTION_PAYMENT_MODE: 2c2p-promptpay-production
      PRODUCTION_TWOC2P_MERCHANT_ID: ${{ secrets.PRODUCTION_TWOC2P_MERCHANT_ID }}
      PRODUCTION_TWOC2P_SECRET_KEY: ${{ secrets.PRODUCTION_TWOC2P_SECRET_KEY }}
      PRODUCTION_TWOC2P_PROMPTPAY_CAPABILITY_VERIFIED: ${{ vars.PRODUCTION_TWOC2P_PROMPTPAY_CAPABILITY_VERIFIED }}
      PRODUCTION_TWOC2P_PROMPTPAY_CHECKOUT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard read-only production check
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm }}" = "CHECK-PROMPTPAY-PRODUCTION"
          test "$PRODUCTION_TWOC2P_PROMPTPAY_CAPABILITY_VERIFIED" = "true"
          test -n "$PRODUCTION_TWOC2P_MERCHANT_ID"
          test -n "$PRODUCTION_TWOC2P_SECRET_KEY"
          grep -q '"PAYMENT_MODE": "disabled"' wrangler.jsonc
          ! grep -q 'TWOC2P_PRODUCTION_SECRET_KEY' wrangler.jsonc
      - name: Verify source and prepare canary config
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/rebuild/check-production-readiness.cjs
          node scripts/rebuild/prepare-production.cjs
          node scripts/rebuild/run-tests.cjs
          node scripts/rebuild/build-client.cjs --check
          node scripts/rebuild/check-syntax.cjs
          node scripts/rebuild/check-static.cjs
          node scripts/rebuild/check-staging.cjs --allow-unconfigured
          node scripts/rebuild/check-secrets.cjs
          git diff --check
      - name: Guard prepared PromptPay config
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"PAYMENT_MODE": "2c2p-promptpay-production"' work/production/prepared/wrangler.jsonc
          grep -q '"TWOC2P_PROMPTPAY_ENABLED": "true"' work/production/prepared/wrangler.jsonc
          grep -q '"TWOC2P_PROMPTPAY_MERCHANT_CAPABILITIES_VERIFIED": "true"' work/production/prepared/wrangler.jsonc
          grep -q '"TWOC2P_PROMPTPAY_CHECKOUT_ENABLED": "false"' work/production/prepared/wrangler.jsonc
          grep -q '"TWOC2P_PROMPTPAY_BACKEND_ENABLED": "true"' work/production/prepared/wrangler.jsonc
          ! grep -q 'PRODUCTION_TWOC2P_SECRET_KEY' work/production/prepared/wrangler.jsonc
          ! grep -q 'TWOC2P_PRODUCTION_SECRET_KEY' work/production/prepared/wrangler.jsonc
      - name: Wrangler PromptPay dry run only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config work/production/prepared/wrangler.jsonc --outdir work/promptpay-production-dry-run
          test -d work/promptpay-production-dry-run
          echo "PASS PromptPay production dry run; no deployment performed"
